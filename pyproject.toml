[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocrop"
dynamic = ["version"]
description = "Face-aware image cropping for Python and shell workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
authors = [
  { name = "François Leblanc", email = "leblancfg@gmail.com" },
]
dependencies = [
  "numpy>=1.10",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=9.0.0",
]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/leblancfg/autocrop"
Issues = "https://github.com/leblancfg/autocrop/issues"
Changelog = "https://github.com/leblancfg/autocrop/blob/master/docs/changelog.md"

[project.scripts]
autocrop = "autocrop:command_line_interface"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.16.8",
  "ty>=0.0.82",
  "typing-extensions>=4.15",
]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90", "ANN"]
# Explicit Any is allowed at NumPy, Pillow, and argparse boundaries.
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.src]
include = ["autocrop", "tests/typing"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.hatch.version]
path = "autocrop/__version__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/autocrop",
  "/README.md",
  "/LICENSE",
  "/LICENSE-3RD-PARTY.txt",
  "/changelog.md",
  "/docs/changelog.md",
]

[tool.hatch.build.targets.wheel]
packages = ["autocrop"]

[tool.hatch.build.targets.wheel.force-include]
"autocrop/face_detection_yunet_2023mar.onnx" = "autocrop/face_detection_yunet_2023mar.onnx"
